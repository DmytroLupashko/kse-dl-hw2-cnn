    "pyarrow (==25.0.1)",
    "scikit-learn (==1.9.0)",
    "matplotlib (==3.11.1)",
    "seaborn (==0.13.2)",
    "torch (==2.13.0)",
    "torchvision (==0.28.0)",
    "lightning (==2.6.5)",
    "torchmetrics (==1.9.0)",
    "mlflow (==3.16.1)",
    "ipykernel (==7.3.0)",
    "nbconvert (==7.17.1)",
    "nbformat (==5.11.1)",
    "timm (==1.0.30)",
    "albumentations (==2.0.8)",
    "iterative-stratification (==0.1.9)"
