name = "ResNet-18"
timm_model = "resnet18.a1_in1k"
experiment = "cnn-model-oversample-8-only"
folds = [0, 1]  # Fast validation mode
epochs = 10
img_size = 224
oversample = 8  # VIP rows 8 times per epoch
is_new = true  # `core.data` sampling: `Oversample`, pos_weight power 0.5
batch_size = 64
num_workers = 10  # one per performance core; main process and MPS keep efficiency cores
