name = "ConvNeXt-Tiny"
timm_model = "convnext_tiny.fb_in1k"
experiment = "cnn-model-convnext-tiny"
folds = [0, 1, 2, 3, 4]  # Full validation mode
epochs = 10
img_size = 224
augment = "coarse_dropout_non_vip"  # colored holes on non-VIP rows, core.augment.CoarseDropoutNonVip
oversample = 8  # VIP rows 8 times per epoch
downsample = 0.2  # non-VIP rows: random 20% per epoch, pos_weight counted over draws
pos_weight_power = 1.0  # full ratio (N - n_c) / n_c
batch_size = 64
num_workers = 4
