    class LitAutoEncoder(LightningModule):
        def __init__(self, auto_encoder):
            super().__init__()
            self.auto_encoder = auto_encoder
            self.metric = torch.nn.MSELoss()

        def forward(self, x):
            return self.auto_encoder.encoder(x)

        def training_step(self, batch, batch_idx):
            x, _ = batch
            x_hat = self.auto_encoder(x)
            loss = self.metric(x, x_hat)
            return loss

        def validation_step(self, batch, batch_idx):
            self._shared_eval(batch, batch_idx, "val")

        def test_step(self, batch, batch_idx):
            self._shared_eval(batch, batch_idx, "test")

        def _shared_eval(self, batch, batch_idx, prefix):
            x, _ = batch
            x_hat = self.auto_encoder(x)
            loss = self.metric(x, x_hat)
            self.log(f"{prefix}_loss", loss)
  type: good
  reason: Straightforward. Minimum code for its job; Lightning hooks only, loop left to Trainer. Shared eval step reused by val and test, no duplication.

