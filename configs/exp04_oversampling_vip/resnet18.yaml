name: "ResNet-18"
experiment: "cnn-model-oversampling-vip"
data:
  img_size: 224
  oversample: 8  # VIP rows 8 times per epoch, VIP pos_weight / 8
  batch_size: 64
  num_workers: 4
model:
  net:
    class_path: core.model.timm_net
    init_args:
      model_name: "resnet18.a1_in1k"
      pretrained: true
trainer:
  max_epochs: 10
