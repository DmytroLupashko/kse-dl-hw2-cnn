name = "ResNet-18 new augmentations"
timm_model = "resnet18.a1_in1k"
experiment = "cnn-model-v3-ablation"
folds = [0, 1]  # Fast validation mode
epochs = 10
img_size = 224
augment = "v3_no_crop"  # `core.augment.V3NoCrop`: v3 without box-safe crop
oversample = 8  # VIP rows 8 times per epoch, VIP pos_weight / 8
batch_size = 64
num_workers = 4
