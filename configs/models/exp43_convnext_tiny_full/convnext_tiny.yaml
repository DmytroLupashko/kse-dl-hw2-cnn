name: "ConvNeXt-Tiny"
experiment: "cnn-exp43-convnext-tiny-full"
# every training row, no validation: train with `python -m core.training.fit` (run `ConvNeXt-Tiny full`); `folds` unused
data:  # exp34 settings
  img_size: 224
  augment:
    class_path: core.data.augment.recipes.CoarseDropoutNonVip  # colored holes on non-VIP rows
  oversample: 8  # VIP rows 8 times per epoch
  downsample: 0.2  # non-VIP rows: random 20% per epoch, pos_weight counted over draws
  batch_size: 64
  num_workers: 4
model:
  net:
    class_path: core.training.model.timm_net
    init_args:
      model_name: "convnext_tiny.fb_in1k"
      pretrained: true
trainer:
  max_epochs: 10  # fixed, last epoch kept: no validation picks best
