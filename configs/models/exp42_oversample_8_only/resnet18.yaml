name: "ResNet-18"
experiment: "cnn-model-oversample-8-only"
data:
  img_size: 224
  oversample: 8  # VIP rows 8 times per epoch
  batch_size: 64
  num_workers: 10  # one per performance core; main process and MPS keep efficiency cores
model:
  net:
    class_path: core.training.model.timm_net
    init_args:
      model_name: "resnet18.a1_in1k"
      pretrained: true
trainer:
  max_epochs: 10
