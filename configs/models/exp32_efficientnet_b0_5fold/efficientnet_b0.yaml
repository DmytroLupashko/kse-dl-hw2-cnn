name: "EfficientNet-B0"
experiment: "cnn-model-efficientnet-b0-5fold"
data:
  img_size: 224
  augment:
    class_path: core.data.augment.recipes.CoarseDropoutNonVip  # colored holes on non-VIP rows, core.data.augment.CoarseDropoutNonVip
  oversample: 8  # VIP rows 8 times per epoch
  downsample: 0.2  # non-VIP rows: random 20% per epoch, pos_weight counted over draws
  batch_size: 64
  num_workers: 4
model:
  net:
    class_path: core.training.model.timm_net
    init_args:
      model_name: "efficientnet_b0.ra_in1k"
      pretrained: true
trainer:
  max_epochs: 10
