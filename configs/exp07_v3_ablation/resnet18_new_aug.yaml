name: "ResNet-18 new augmentations"
experiment: "cnn-model-v3-ablation"
data:
  img_size: 224
  augment:
    class_path: dataset.augment.V3NoCrop  # `dataset.augment.V3NoCrop`: v3 without box-safe crop
  oversample: 8  # VIP rows 8 times per epoch, VIP pos_weight / 8
  batch_size: 64
  num_workers: 4
model:
  net:
    class_path: training.model.timm_net
    init_args:
      model_name: "resnet18.a1_in1k"
      pretrained: true
trainer:
  max_epochs: 10
