# tiny model, data subset, small images
name: "MobileNetV3-S-050"
experiment: "cnn-playground-quick"
folds: [0, 1]
data:
  img_size: 64
  n_other: 60
model:
  pos_weight_power: 0.75  # damped ratio without oversampling
  net:
    _target_: timm.create_model
    model_name: "mobilenetv3_small_050.lamb_in1k"
    pretrained: true
trainer:
  epochs: 3
  log_every_n_steps: 5
